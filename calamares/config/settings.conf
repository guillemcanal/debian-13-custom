---

instances:
- id: apt-sources
  module: preservefiles
  config: preservefiles-apt-sources.conf
- id: target-files
  module: preservefiles
  config: preservefiles-target-files.conf
- id: autoremove
  module: shellprocess
  config: shellprocess-autoremove.conf

modules-search: [ local, /usr/lib/calamares/modules ]

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
- show:
  - welcome
  - tpm2-state
  - locale
  - keyboard
  - packagechooser
  - partition
  - users
  - summary

- exec:
  - partition
  - mount
  - docker-nocow
  - select-desktop-image
  - unpackfs
  - dpkg-unsafe-io
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - preservefiles@apt-sources
  - bootloader-stack-swap
  - tpm2-enroll
  - preservefiles@target-files
  - shellprocess@autoremove
  - dpkg-unsafe-io-undo
  - umount

- show:
  - finished

branding: debian
prompt-install: true
dont-chroot: false
