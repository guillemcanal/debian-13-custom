---
files:
    - from: log
      dest: /var/log/Calamares.log
      perm: "root:root:0600"
    - from: log
      dest: /home/${USER}/installation.log
      optional: true
    - from: config
      dest: /var/log/Calamares-install.json
      perm: "root:root:0600"
    - src: /usr/share/standard-installer/target-files/etc/apt/sources.list.d/debian.sources
      dest: /etc/apt/sources.list.d/debian.sources
      perm: "root:root:0644"
    - src: /usr/share/standard-installer/target-files/etc/apt/sources.list.d/debian-backports.sources
      dest: /etc/apt/sources.list.d/debian-backports.sources
      perm: "root:root:0644"
    - src: /usr/share/standard-installer/target-files/etc/apt/preferences.d/99-debian-backports
      dest: /etc/apt/preferences.d/99-debian-backports
      perm: "root:root:0644"

perm: "root:root:0644"
