source /boot/grub/config.cfg
background_color "#16181e"

# Centered in the 80x24 terminal GRUB shows while loading.
function loading {
	echo -e "Loading…"
}

# Live boot
menuentry "Live system (amd64)" --hotkey=l {
	loading
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

# One entry per desktop layer (see live/filesystem.<desktop>.module).
for desktop in gnome kde xfce dank; do
	menuentry "Live system (amd64 ${desktop})" ${desktop} {
		loading
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ module=$2
		initrd	@INITRD_LIVE@
	}
done

menuentry "Live system (amd64 fail-safe mode)" {
	loading
	linux	@KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@
	initrd	@INITRD_LIVE@
}

# Boots the live system straight into install-debian (see
# config/includes.chroot/etc/profile.d/99-run-installer.sh), which is
# triggered by the "run-installer" kernel command line token below.
menuentry "Install Debian" --hotkey=i {
	loading
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ run-installer
	initrd	@INITRD_LIVE@
}

# You can add more entries like this
# menuentry "Alternate live boot" {
# linux @KERNEL_LIVE@ @APPEND_LIVE@ custom options here
# initrd @INITRD_LIVE@
# }
# menuentry "Alternate graphical installer" {
# linux @KERNEL_GI@ @APPEND_GI@ custom options here
# initrd @INITRD_GI@
# }
# menuentry "Alternate textual installer" {
# linux @KERNEL_DI@ @APPEND_DI@ custom options here
# initrd @INITRD_DI@
# }

# Installer (if any)
if @ENABLE_INSTALL_MENU@; then

source	/boot/grub/install_start.cfg

submenu 'Advanced install options ...' --hotkey=a {

	source /boot/grub/theme.cfg

	source	/boot/grub/install.cfg

}
fi

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Memtest (if any)
	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verify the checksums
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
