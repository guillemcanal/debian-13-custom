backend: apt

# Same as calamares-settings-debian's default, plus the live-only tools
# installed through config/package-lists/*.list.chroot_live (listed in
# filesystem.packages-remove) that unpackfs copied onto the target.
operations:
  - remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'live-task-localisation'
      - 'live-task-recommended'
      - 'calamares-settings-debian'
      - 'gum'
